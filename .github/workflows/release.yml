name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify tag matches Maven version
        id: version
        shell: bash
        run: |
          VERSION="$(mvn --batch-mode help:evaluate -Dexpression=project.version -q -DforceStdout)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" != "$TAG_VERSION" ]]; then
            echo "Git tag v${TAG_VERSION} does not match pom.xml version ${VERSION}."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build plugin
        run: mvn --batch-mode clean package -Dmaven.test.skip=true

      - name: Create GitHub release and upload plugin jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${{ steps.version.outputs.version }}"
          JAR="target/WkKit-${VERSION}.jar"
          if [[ ! -f "$JAR" ]]; then
            echo "Expected build artifact was not found: $JAR"
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --title "$VERSION" --generate-notes
          fi
